<h1>picrew-agenti</h1>
<p>Private tool of the PiCrew association. Its agents use their own picrew.cz Google accounts to read files, spreadsheets and calendars explicitly shared with those accounts and to add rows to the association's own spreadsheets. It is not offered to anyone else.</p>
